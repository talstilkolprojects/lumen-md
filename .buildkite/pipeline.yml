    command: |-
      buildkite-agent artifact download 'ci-out/vitest-summary.json' . || true
      node scripts/buildkite/receipt.mjs --gates vitest,vitest-merge,static,lint,licenses,build,e2e-chromium,e2e-firefox,e2e-webkit,e2e-prod,e2e-headers,local-ai,ocr-cer,lighthouse
    agents:
