      gate 'Bundle-size budget' <<'LUMEN_STEP'
      npm run budget -- --json bundle-sizes.json
      LUMEN_STEP
      gates_done
      LUMEN_JOB
    agents:
      queue: "linux"
    timeout_in_minutes: 25
    notify:
