# GENERATED from .github/workflows/ci.yml by scripts/buildkite/pipeline.mjs (plan W7.21). Do not edit by hand:
#   npm run ci:pipeline -- --write     regenerate after a change to ci.yml or scripts/buildkite/lib.mjs
#   npm run ci:pipeline -- --check     fails when this file is stale or a ci.yml gate is missing
# Buildkite's pipeline settings upload it with `buildkite-agent pipeline upload` (docs: self-hosting/buildkite).
env:
  LUMEN_CI: "buildkite"
notify:
  - github_commit_status:
      context: "lumen/buildkite"
steps:
  - label: ":scissors: vitest: plan the shards"
    key: "vitest-plan"
    command: |-
      buildkite-agent meta-data set lumen:started-at "$$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      node scripts/buildkite/vitest-shards.mjs plan --shards 4 --timings "$${LUMEN_CI_CACHE:-.}/vitest-timings.json" --out ci-out/vitest-shards.json
    agents:
      queue: "linux"
    artifact_paths:
      - "ci-out/vitest-shards.json"
    timeout_in_minutes: 5
    retry:
      automatic:
        - exit_status: -1
          limit: 2
        - exit_status: 255
          limit: 1
  - label: ":vitest: vitest shard %n"
    key: "vitest"
    depends_on: "vitest-plan"
    parallelism: 4
    command: |-
      buildkite-agent artifact download ci-out/vitest-shards.json .
      LUMEN_CI_JOB=vitest bash scripts/buildkite/run.sh <<'LUMEN_JOB'
      gate 'Vitest shard (of 4)' <<'LUMEN_STEP'
      node scripts/buildkite/vitest-shards.mjs run --plan ci-out/vitest-shards.json
      LUMEN_STEP
      gates_done
      LUMEN_JOB
    agents:
      queue: "linux"
    artifact_paths:
      - ".vitest/blob/*.json"
    timeout_in_minutes: 45
    notify:
      - github_commit_status:
          context: "lumen/buildkite: vitest"
    retry:
      automatic:
        - exit_status: -1
          limit: 2
        - exit_status: 255
          limit: 1
  - label: ":vitest: vitest: merge + coverage gate"
    key: "vitest-merge"
    depends_on: "vitest"
    command: |-
      buildkite-agent artifact download ci-out/vitest-shards.json .
      buildkite-agent artifact download '.vitest/blob/*.json' .
      LUMEN_CI_JOB=vitest-merge bash scripts/buildkite/run.sh <<'LUMEN_JOB'
      gate 'Merge the shard reports; every planned file ran' <<'LUMEN_STEP'
      node scripts/buildkite/vitest-shards.mjs merge --plan ci-out/vitest-shards.json
      LUMEN_STEP
      gate 'Coverage gate (lines >= 65%)' <<'LUMEN_STEP'
      pct=$$(node -e 'console.log(require("./coverage/coverage-summary.json").total.lines.pct)')
      echo "Coverage lines: $$pct%"
      echo "::notice title=coverage::total lines $$pct%"
      node -e '
        const s = require("./coverage/coverage-summary.json");
        for (const part of ["/src/layouts/", "/src/components/", "/src/App.tsx", "/src/i18n/", "/src/plugins/", "/src/renderer/", "/src/views/"]) {
          let total = 0, covered = 0;
          for (const [file, m] of Object.entries(s)) {
            if (file !== "total" && file.includes(part)) { total += m.lines.total; covered += m.lines.covered; }
          }
          const pct = total ? ((100 * covered) / total).toFixed(2) : "n/a";
          console.log(`::notice title=coverage $${part}::$${pct}% ($${covered}/$${total} lines)`);
        }
      '
      awk -v p="$$pct" 'BEGIN { exit (p < 65) }' || (echo "::error::Lines coverage $$pct% < 65% gate" && exit 1)
      LUMEN_STEP
      gates_done
      LUMEN_JOB
      if [ -n "$${LUMEN_CI_CACHE:-}" ] && [ -f ci-out/vitest-timings.json ]; then cp ci-out/vitest-timings.json "$$LUMEN_CI_CACHE/vitest-timings.json"; fi
    agents:
      queue: "linux"
    artifact_paths:
      - "ci-out/vitest-summary.json"
      - "ci-out/vitest-timings.json"
      - "coverage/coverage-summary.json"
    timeout_in_minutes: 20
    notify:
      - github_commit_status:
          context: "lumen/buildkite: vitest-merge"
    retry:
      automatic:
        - exit_status: -1
          limit: 2
        - exit_status: 255
          limit: 1
  - label: ":white_check_mark: static gates"
    key: "static"
    command: |-
      LUMEN_CI_JOB=static LUMEN_CI_KEEP_GOING=1 bash scripts/buildkite/run.sh <<'LUMEN_JOB'
      gate Typecheck <<'LUMEN_STEP'
      npm run typecheck
      LUMEN_STEP
      gate 'Code hygiene (no `as any` / console.log in production src)' <<'LUMEN_STEP'
      npm run hygiene
      LUMEN_STEP
      gate 'Security headers match security/policy.json' <<'LUMEN_STEP'
      npm run headers
      LUMEN_STEP
      gate 'Docs sync (docs name only commands and scripts that exist; no hand-typed counts in README)' <<'LUMEN_STEP'
      npm run -s docs:sync
      LUMEN_STEP
      gate 'Plan matches plan/plan.json' <<'LUMEN_STEP'
      npm run plan:check
      LUMEN_STEP
      gate 'No hard-coded UI strings (plan 9.1)' <<'LUMEN_STEP'
      npm run -s i18n:hardcoded
      LUMEN_STEP
      gate 'Definition of done for every ✅ task' <<'LUMEN_STEP'
      npm run dod -- --done
      LUMEN_STEP
      gate 'Unused files (no new src/ file that nothing imports — plan 0.16)' <<'LUMEN_STEP'
      npm run unused
      LUMEN_STEP
      gate 'Docs complete (every sidebar page in en + he; 13.1.1 areas covered; links resolve)' <<'LUMEN_STEP'
      npm run -s docs:complete
      LUMEN_STEP
      gate 'i18n drift gate' <<'LUMEN_STEP'
      # Every string in its sorted domain file (plan 0.3), and the
      # committed manifest (i18n/keys/) that feeds translation tooling.
      node scripts/i18n-split.mjs --check
      node scripts/extract-i18n-keys.mjs --check
      count() { node --input-type=module -e "import { readLocale } from './scripts/lib/i18n-files.mjs'; console.log(Object.keys(readLocale('$$1')).length)"; }
      en_count=$$(count en)
      # Hebrew ships as lazy JSON chunks like the other locales.
      he_count=$$(count he)
      diff=$$(( en_count > he_count ? en_count - he_count : he_count - en_count ))
      echo "i18n keys — en: $$en_count, he: $$he_count, diff: $$diff"
      if [ "$$diff" -gt 10 ]; then
        echo "::error::i18n drift > 10 keys; run `node scripts/print-missing-i18n-keys.mjs` and fix."
        exit 1
      fi
      LUMEN_STEP
      gates_done
      LUMEN_JOB
    agents:
      queue: "linux"
    timeout_in_minutes: 20
    notify:
      - github_commit_status:
          context: "lumen/buildkite: static"
    retry:
      automatic:
        - exit_status: -1
          limit: 2
        - exit_status: 255
          limit: 1
  - label: ":eslint: lint"
    key: "lint"
