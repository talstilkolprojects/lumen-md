  - label: ":package: build + budget"
    key: "build"
    command: |-
      LUMEN_CI_JOB=build bash scripts/buildkite/run.sh <<'LUMEN_JOB'
      gate Build COLLAB_TOKEN_SECRET=ci-canary-collab-token-secret-7f3a9c2e1b COLLAB_ACCESS_KEY=ci-canary-collab-access-key-5d8e LUMEN_COLLAB_TOKEN=ci-canary-lumen-collab-token-2c4b <<'LUMEN_STEP'
      npm run build
      LUMEN_STEP
      gate 'No collab secrets in the bundle' VITE_RESEARCH_TOKEN=ci-canary-research-token-4e9b1c VITE_CI_CANARY_SECRET=ci-canary-vite-secret-8d2f7a <<'LUMEN_STEP'
      node scripts/check-bundle-secrets.mjs dist
      LUMEN_STEP
      gate 'No VITE_* secrets in the bundle' VITE_RESEARCH_TOKEN=ci-canary-research-token-4e9b1c VITE_CI_CANARY_SECRET=ci-canary-vite-secret-8d2f7a <<'LUMEN_STEP'
      node scripts/check-vite-secrets.mjs dist
