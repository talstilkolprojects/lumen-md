<!doctype html>
<html lang="he" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP rendered from security/policy.json (npm run headers:write). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://avatars.githubusercontent.com https://*.googleusercontent.com; media-src 'self' blob:; connect-src 'self' blob: data: wss://signaling.yjs.dev wss://y-webrtc-eu.fly.dev https://api.openai.com https://api.anthropic.com https://generativelanguage.googleapis.com https://api.mistral.ai http://localhost:11434 http://127.0.0.1:11434 http://localhost:8787 http://127.0.0.1:8787 http://localhost:8010 http://127.0.0.1:8010 http://localhost:9999 http://127.0.0.1:9999 http://localhost:5199 http://127.0.0.1:5199 https://api.languagetool.org https://bsky.social https://*.host.bsky.network https://plc.directory https://kroki.io https://www.sefaria.org https://oauth2.googleapis.com https://www.googleapis.com https://api.dropboxapi.com https://content.dropboxapi.com https://github.com https://api.github.com https://huggingface.co https://*.huggingface.co https://*.hf.co https://raw.githubusercontent.com https://webr.r-wasm.org https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!-- The interface language and direction (plan W4.10: the saved choice,
         else the system's language) and the saved theme, applied before the
         boot shell paints (no inline script: the CSP forbids it). The page is
         written Hebrew-first, so it is right even without JavaScript. -->
    <script src="/locale-boot.js"></script>
    <script src="/theme-boot.js"></script>
    <meta name="description" content="Lumen — עורך Markdown מקומי ופרטי שנבנה לעברית. A local, private Markdown editor built for Hebrew." />
    <title>Lumen — עורך פתקים בעברית</title>
    <!-- SEO & Social -->
    <meta property="og:title" content="Lumen — עורך פתקים שנבנה לעברית" />
    <meta property="og:description" content="עורך Markdown חינמי וקוד פתוח: הפתקים נשארים במכשיר, עובד בלי אינטרנט, ועברית מימין לשמאל עובדת כמו שצריך." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lumen-md.vercel.app" />
    <meta property="og:image" content="https://lumen-md.vercel.app/og-image.png" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lumen — עורך פתקים שנבנה לעברית" />
    <meta name="twitter:description" content="עורך Markdown מקומי ופרטי שנבנה לעברית." />
    <meta name="twitter:image" content="https://lumen-md.vercel.app/og-image.png" />
    <link rel="canonical" href="https://lumen-md.vercel.app" />
    <!-- PWA -->
    <meta name="theme-color" content="#7c5cfc" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Lumen",
      "url": "https://lumen-md.vercel.app",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Web, iOS, Android",
      "description": "A free, open-source, local Markdown editor built for Hebrew and right-to-left writing.",
      "inLanguage": ["he", "en"],
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
    <!-- Fonts are self-hosted (src/fonts.ts): no request to Google, and
         they work offline from the first visit. -->
    <style>
      .boot-shell{position:fixed;inset:0;background:#0f1115;color:#e7e9ee;font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
      html:not(.dark) .boot-shell{background:#fafafa;color:#1c1f24}
      .boot-bar{height:44px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid rgba(127,127,127,.2)}
      .boot-logo{font-weight:700;letter-spacing:.02em}
      .boot-page{max-width:720px;margin:48px auto;padding:0 20px;display:flex;flex-direction:column;gap:14px}
      .boot-line{height:12px;border-radius:6px;background:rgba(127,127,127,.18)}
      .boot-line.w60{width:60%;height:22px}.boot-line.w80{width:80%}.boot-line.w70{width:70%}
      @media (prefers-reduced-motion:no-preference){.boot-line{animation:boot 1.2s ease-in-out infinite alternate}}
      @keyframes boot{to{opacity:.5}}
      .boot-note{margin:0;white-space:pre-wrap;word-break:break-word;font:15px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.85}
    </style>
  </head>
  <body class="bg-bg text-fg antialiased">
    <div id="root">
      <!-- Boot shell (C1): painted before any JavaScript runs; React replaces
           it on first render. Colours follow the saved theme via the class
           set by /theme-boot.js in <head>, falling back to dark. -->
      <div class="boot-shell" aria-hidden="true">
        <div class="boot-bar"><span class="boot-logo">Lumen</span></div>
        <div class="boot-page"><div class="boot-line w60"></div><div class="boot-line"></div><div class="boot-line w80"></div><div class="boot-line w70"></div></div>
      </div>
    </div>
    <!-- The last note in the shell, before the bundle (plan W2.21); after the
         shell so it can fill it, before the module so it paints first. -->
    <script src="/note-boot.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
